<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun Son Solar — Login</title>
<style>
   :root{
    --blue-deep: #3160e2;
    --blue-mid: #3b6fe0;
    --blue-soft: #6f93ea;
    --ink: #1c2b4a;
    --card-bg: rgba(255,255,255,0.88);
    --field-line: #c7cfe0;
    --gold: #e0a53a;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
    padding: 32px 16px;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:720px;
    aspect-ratio: 461/328;
    border-radius:6px;
    overflow:hidden;
    box-shadow: 0 30px 60px rgba(42, 67, 168, 0.35);
    background-size: cover;
    background-position: center;
  }

  .card{
    position:relative;
    z-index:2;
    width: min(78%, 380px);
    margin: 0 auto;
    top: 6%;
    background: var(--card-bg);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 4px;
    padding: 28px 34px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow: 0 18px 40px rgba(10,20,60,0.28);
  }

  .logo{
    width:82px; height:82px;
    border-radius:50%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:10px;
    overflow:hidden;
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .brand{
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1.5px;
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 16px;
    text-align:center;
    font-weight:700;
  }

  form{ width:100%; }

  .field{
    width:100%;
    margin-bottom: 14px;
  }
  .field label{
    display:block;
    font-size: 11px;
    color: #566;
    margin-bottom: 4px;
    color:#4a5a7a;
  }
  .field-wrap{
    display:flex;
    align-items:center;
    border-bottom: 1.5px solid var(--field-line);
    padding-bottom: 5px;
    gap:8px;
  }
  .field-wrap input{
    flex:1;
    border:none;
    outline:none;
    font-size:14px;
    background:transparent;
    color: var(--ink);
    font-family:inherit;
  }
  .field-wrap svg{ flex-shrink:0; opacity:0.55; }
  .toggle-eye{
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    display:flex;
    opacity:0.55;
  }

  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 11px;
    margin: 10px 0 16px;
    color:#4a5a7a;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .remember input{ accent-color: var(--blue-deep); }
  .row-between a{
    color:#4a5a7a;
    text-decoration:none;
  }
  .row-between a:hover{ text-decoration:underline; }

  .btn-login{
    width:100%;
    padding: 9px 0;
    background: var(--blue-deep);
    color:#fff;
    border:none;
    border-radius: 3px;
    font-size: 14px;
    font-weight:600;
    letter-spacing:0.5px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .btn-login:hover{ background:#1740af; }
  .btn-login:focus-visible{ outline: 2px solid var(--gold); outline-offset:2px; }

  .signup-line{
    font-size: 11px;
    color:#5a6a8a;
    margin-top: 12px;
    text-align:center;
  }
  .signup-line a{
    color: var(--blue-deep);
    font-weight:600;
    text-decoration:none;
  }
  .signup-line a:hover{ text-decoration:underline; }

  .socials{
    display:flex;
    gap:12px;
    margin-top: 16px;
  }
  .social-btn{
    width:30px; height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    border:1px solid #dde2ee;
    background:#fff;
  }
  .social-btn:hover{ filter:brightness(0.96); }

  @media (max-width:480px){
    .card{ width:88%; padding:22px 20px 20px; top:5%; }
  }

</style>
</head>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a5a7a" stroke-width="2">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#" id="forgotLink">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">LOGIN</button>
    </form>

    <div class="signup-line">
      Don't have an account? <a href="Sasis-registration.html" id="registerLink">Register</a>
    </div>

    <div class="socials">
      <button class="social-btn" id="googleBtn" aria-label="Sign in with Google">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.5 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.4c-2 1.5-4.6 2.4-7.5 2.4-5.3 0-9.7-3.3-11.3-8l-6.6 5C10 39.6 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.4C40.5 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      </button>
      <button class="social-btn" id="facebookBtn" aria-label="Sign in with Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const pwInput = document.getElementById('password');
  const toggleEye = document.getElementById('toggleEye');
  toggleEye.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    toggleEye.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });
  
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    console.log('Login submitted:', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      remember: document.getElementById('remember').checked
    });
  });

  document.getElementById('forgotLink').addEventListener('click', function(e){
    e.preventDefault();
    console.log('Forgot password clicked');
  });


  document.getElementById('googleBtn').addEventListener('click', function(){
    console.log('Google login clicked');
  });

  document.getElementById('facebookBtn').addEventListener('click', function(){
    console.log('Facebook login clicked');
  });
</script>

</body>
</html>
